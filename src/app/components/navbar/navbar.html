<nav
  *ngIf="type === 'header'"
  class="w-full border-b border-cyan-500/10 bg-slate-950/90 backdrop-blur-xl sticky top-0 z-50 shadow-2xl shadow-cyan-500/10"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 lg:px-16 h-24 md:h-28 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4">

    <a routerLink="/" class="relative group">
      <h1 class="text-3xl md:text-5xl font-black tracking-wide text-cyan-400 logo-glow">
        Nomina<span class="text-white">Pro</span>
      </h1>
    </a>

    <div class="flex items-center gap-5 md:gap-12 text-base md:text-2xl font-bold text-slate-300">
      <a routerLink="/" class="nav-link">Home</a>
      <a routerLink="/company" class="nav-link">Company</a>
      <a routerLink="/employee" class="nav-link">Employee</a>
    </div>

  </div>
</nav>

<footer
  *ngIf="type === 'footer'"
  class="w-full border-t border-cyan-500/10 bg-slate-950/90 backdrop-blur-xl mt-auto"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-10 lg:px-16 py-8 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">

    <h2 class="text-2xl md:text-3xl font-black text-cyan-400 logo-glow">
      Nomina<span class="text-white">Pro</span>
    </h2>

    <p class="text-slate-400 text-sm md:text-base">
      Developed by
      <span class="text-cyan-400 font-bold">
        Jose Cabrera, Anyeli Jaramillo & Danna Lagos
      </span>
    </p>

    <p class="text-slate-500 text-sm">
      © 2026 NominaPro
    </p>

  </div>
</footer>
